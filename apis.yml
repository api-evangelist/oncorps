name: OnCorps AI
description: >-
  OnCorps AI is an agentic AI platform for fund operations at financial institutions,
  automating complex middle- and back-office tasks through AI agents that predict root
  causes and reduce time and cost. Its products span NAV oversight, investment operations,
  reconciliation, financial report review, performance verification, security attribution,
  cash and positions validation, accounting controls, OTC confirmations, and FX/share-class
  hedging, plus Deep Industry Research Agents (DIRA) for financial transaction analysis.
  OnCorps serves asset managers and fund administrators including PIMCO and Natixis, and is
  SOC 1 and ISO 27001 certified. No public API or developer program is currently published;
  this profile is maintained as a company record in the API Evangelist network.
